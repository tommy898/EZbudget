<!--This page lets user add a single spending to their list.
One can add amount, date of spending, category, and an optional note.
-->
<!doctype html>
<html lang="en">
    <head>
        <title>Add</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src="main.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
        <link
            href="https://fonts.googleapis.com/css2?family=Antic+Slab&display=swap"
            rel="stylesheet"
        >
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;display=block"
        >
    </head>
    <body>
        <header>
            <h1>Add a Spending</h1>
        </header>
        <main>
            <form id="spending">
                <div>
                    <label for="spending-amount">Amount ($)</label>
                    <input type="number" id="spending-amount" min="0.01" step="0.01" required>
                </div>

                <div>
                    <label for="spending-category">Category</label>
                    <select id="spending-category" required>
                        <option value="" disabled selected>Choose a category</option>
                        <option value="food">Food</option>
                        <option value="transport">Transport</option>
                        <option value="housing">Housing</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="others">Others</option>
                    </select>
                </div>

                <div>
                    <label for="spending-date">Date</label>
                    <input type="date" id="spending-date" required>
                </div>

                <div>
                    <label for="spending-note">Note (optional)</label>
                    <textarea id="spending-note" row="3" placeholder="Enter here..."></textarea>
                </div>
                <p id="entry-confirm" role="status"></p>
                <button type="submit" id="submit-form">Confirm</button>
            </form>
        </main>
        <footer>
            <nav>
                <a href="main.html">
                    <div>
                        <span class="material-symbols-outlined">home</span>
                        <p>Home</p>
                    </div>
                </a>
                <a href="add.html">
                    <div>
                        <span class="material-symbols-outlined">add_box</span>
                        <p>Add</p>
                    </div>
                </a>
                <a href="manage.html">
                    <div>
                        <span class="material-symbols-outlined">list</span>
                        <p>Manage</p>
                    </div>
                </a>
                <a href="settings.html">
                    <div>
                        <span class="material-symbols-outlined">build</span>
                        <p>Settings</p>
                    </div>
                </a>
            </nav>
        </footer>
    </body>
</html>
