<!--This page lets user set their budget and see their spending
breakdown.
-->
<!doctype html>
<html lang="en">
    <head>
        <title>Manage</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src="main.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
        <link
            href="https://fonts.googleapis.com/css2?family=Antic+Slab&display=swap"
            rel="stylesheet"
        >
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;display=block"
        >
    </head>
    <body>
        <header>
            <h1>Manage</h1>
        </header>
        <main>
            <section id="budget-setting">
                <h2>
                    Monthly Budget for <span id="current-month"></span> is currently
                    <span id="budget-display"></span>.
                </h2>

                <label for="budget-input">Set budget for the month</label>
                <input type="number" id="budget-input" min="0.01" step="0.01" required>
                <button type="button" id="save-budget">Save Budget</button>
                <p id="confirm-budget" role="status"></p>
            </section>

            <section id="manage-spending">
                <h2>Spendings</h2>
                <div class="manage-category">
                    <h3>Food</h3>
                    <ul id="food-list"></ul>
                </div>
                <div class="manage-category">
                    <h3>Transportation</h3>
                    <ul id="transport-list"></ul>
                </div>
                <div class="manage-category">
                    <h3>Housing</h3>
                    <ul id="housing-list"></ul>
                </div>
                <div class="manage-category">
                    <h3>Entertainment</h3>
                    <ul id="entertainment-list"></ul>
                </div>
                <div class="manage-category">
                    <h3>Others</h3>
                    <ul id="others-list"></ul>
                </div>
            </section>
        </main>
        <footer>
            <nav>
                <a href="main.html">
                    <div>
                        <span class="material-symbols-outlined">home</span>
                        <p>Home</p>
                    </div>
                </a>
                <a href="add.html">
                    <div>
                        <span class="material-symbols-outlined">add_box</span>
                        <p>Add</p>
                    </div>
                </a>
                <a href="manage.html">
                    <div>
                        <span class="material-symbols-outlined">list</span>
                        <p>Manage</p>
                    </div>
                </a>
                <a href="settings.html">
                    <div>
                        <span class="material-symbols-outlined">build</span>
                        <p>Settings</p>
                    </div>
                </a>
            </nav>
        </footer>
    </body>
</html>
